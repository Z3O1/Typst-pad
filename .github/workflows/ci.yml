name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发（预热缓存/验证打包）：manual 事件不经过 push，
  # 不会被 concurrency cancel——被 cancel 的 run 保存的缓存不可信（实测教训）
  workflow_dispatch:

# 同分支连续提交时取消排队中的旧 run，避免 Actions 分钟浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux 系统依赖（webkit2gtk 等）
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Rust 缓存：cargo check 命中后只做增量检查，避免每次全量编译。
      # 失败/中断不保存缓存（rust-cache 默认行为）：被 cancel 的 run 保存的半成品
      # 会被后续 run 精确命中且不覆盖，坏缓存永续（踩过坑，勿加 cache-on-failure）
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Cargo check (Tauri shell)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Windows 安装包构建：仅 main 分支触发（PR 不构建，省资源）。
  # 作用有二：1) 验证 Windows 上的真实构建；2) 写入 Rust/npm 缓存，
  # 供后续 tag 触发时的 release.yml 构建命中（所有 tag 都能读 main 的缓存）。
  build-bundles:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 缓存：main 分支触发时命中，避免每次全量编译。
      # 失败/中断不保存缓存（rust-cache 默认行为）：被 cancel 的 run 保存的半成品
      # 会被后续 run 精确命中且不覆盖，坏缓存永续（踩过坑，勿加 cache-on-failure）
      # shared-key 覆盖默认的 job 名 key，与 release.yml 的 release job 共享同一缓存
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-build-windows

      - name: Install frontend dependencies
        run: npm ci

      # 缓存 Tauri 打包工具（WiX/NSIS 下载解压产物），避免每次全新下载；
      # key 含 package-lock.json 哈希：依赖升级（tauri-cli 打包逻辑变化）时自动失效重建，
      # 锁文件不变则稳定命中（与 release.yml 保持一致的 key 规则）
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundle-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build installers (nsis + msi)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

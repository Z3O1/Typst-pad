name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发（预热缓存/验证打包）：manual 事件不经过 push，
  # 不会被 concurrency cancel——被 cancel 的 run 保存的缓存不可信（实测教训）
  workflow_dispatch:

# 同分支连续提交时取消排队中的旧 run，避免 Actions 分钟浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# action 版本约定（2026-09-11）：全部使用 **Node 24 运行时**的版本线，消除 GitHub 的
# "Node.js 20 is deprecated（被强制跑在 Node 24 上）"告警。
# checkout v5 / setup-node v5 / cache v5 / upload-artifact v6（upload-artifact 的 v5 只是
# 预备支持，默认仍跑 Node 20，必须到 v6 才真正消灭告警；release.yml 另有 gh-release v3）。
# Node 24 运行时要求 runner ≥ 2.327.1
# （GitHub 托管 runner 早已满足；自托管需先升级 runner）。
# Swatinem/rust-cache@v2 本身已是 node24、dtolnay/rust-toolchain 是 composite 类型，
# 两者都没有 Node 20 问题，无需升级。升级这些 action **不影响缓存 key**
# （rust-cache 的 key 只由 shared-key/平台/Rust 版本/Cargo.lock 决定），见 docs/maintainers/ci.md。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tauri v2 Linux 系统依赖（webkit2gtk 等）
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Rust 缓存：命中后只做增量检查/编译，避免每次全量编译。
      # 失败/中断不保存缓存（rust-cache 默认行为）：被 cancel 的 run 保存的半成品
      # 会被后续 run 精确命中且不覆盖，坏缓存永续（踩过坑，勿加 cache-on-failure）
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # 格式门：prettier 配置文件在仓库根（`.prettierrc.json` / `.prettierignore`），
      # 与本地 `npm run format` 完全一致；文档/CI YAML 已在 ignore 里（手写对齐）
      - name: Format check (prettier)
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      # Rust 三门（2026-09-19 补）：此前 CI 只跑 `cargo check`——
      # ① 61 个 Rust 单测**从来没在 CI 跑过**；② `rustfmt` component 装了却从不调用；
      # ③ clippy 从不跑（本地有 15 条未处理告警）。
      # `cargo check` 那一步已被 clippy 取代：`clippy --all-targets` 覆盖同样的编译并把告警升级成错误，
      # 两步都跑只会让同一份代码用两套 driver 各编译一遍。
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Windows 安装包构建：main push 或手动触发时构建（PR 不构建，省资源）。
  # 作用有二：1) 验证 Windows 上的真实构建；2) 写入 Rust/npm 缓存，
  # 供后续 tag 触发时的 release.yml 构建命中（所有 tag 都能读 main 的缓存）。
  # 手动触发（workflow_dispatch）必须能跑 build-bundles——预热缓存专用
  build-bundles:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 缓存：main 分支触发时命中，避免每次全量编译。
      # 失败/中断不保存缓存（rust-cache 默认行为）：被 cancel 的 run 保存的半成品
      # 会被后续 run 精确命中且不覆盖，坏缓存永续（踩过坑，勿加 cache-on-failure）
      # shared-key 覆盖默认的 job 名 key，与 release.yml 的 release job 共享同一缓存
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-build-windows

      - name: Install frontend dependencies
        run: npm ci

      # 缓存 Tauri 打包工具（WiX/NSIS 下载解压产物），避免每次全新下载；
      # key 含 package-lock.json 哈希：依赖升级（tauri-cli 打包逻辑变化）时自动失效重建，
      # 锁文件不变则稳定命中（与 release.yml 保持一致的 key 规则）
      - name: Cache Tauri bundler tools
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundle-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build installers (nsis + msi)
        run: npm run tauri build
        env:
          # 自动更新签名私钥（必填，见 release.yml 同处注释：缺了打包直接失败）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 在 main 上就验证"更新清单生成得出来"：脚本写错、安装包没签名（.sig 缺失）
      # 这类问题如果只在发版时才暴露，就得重跑一次完整发版。这里只生成、不发布。
      - name: Verify updater manifest generation
        run: node scripts/generate-latest-json.mjs --out latest.json

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: bundles
          path: |
            src-tauri/target/release/bundle/**
            latest.json
          if-no-files-found: error
          retention-days: 14

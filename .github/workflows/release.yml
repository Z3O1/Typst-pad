name: Release

# 发布在打 tag 时自动进行：本 workflow 自己 checkout + 构建安装包 + 发布，
# 不再依赖 ci.yml 上传的 artifact（download-artifact 只能拿当前 run 的产物，
# 且 push tag 不触发 ci.yml，跨 workflow 取产物链路不可靠）。
# 构建可命中 ci.yml 中 main 分支 build-bundles 写入的 Rust/npm 缓存
# （GitHub Actions 缓存按 ref 隔离，但所有 tag 都能读 main 分支的缓存）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布用 tag，需已存在（如 v0.2.8）"
        required: true
        default: ""

# GITHUB_TOKEN 默认只读；创建/更新 Release 需要 contents: write
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 触发时检出该 tag；手动触发时检出填写的 tag，保证产物与 tag 严格对应
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 缓存：命中 ci.yml 的 main 分支构建写入的缓存，避免每次发版全量编译。
      # 失败/中断不保存缓存（rust-cache 默认行为）：被 cancel 的 run 保存的半成品
      # 会被后续 run 精确命中且不覆盖，坏缓存永续（踩过坑，勿加 cache-on-failure）
      # shared-key 必须与 ci.yml 的 build-bundles 相同（覆盖默认 job 名 key），
      # 否则 key 含 job 名（release），读不到 build-bundles 写的缓存
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-build-windows

      - name: Install frontend dependencies
        run: npm ci

      # 缓存 Tauri 打包工具（WiX/NSIS 下载解压产物），避免每次全新下载；
      # key 含 package-lock.json 哈希：依赖升级（tauri-cli 打包逻辑变化）时自动失效重建，
      # 锁文件不变则稳定命中（与 ci.yml 的 build-bundles 保持一致的 key 规则）
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundle-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build installers (nsis + msi)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: src-tauri/target/release/bundle/**
          draft: true
          generate_release_notes: false

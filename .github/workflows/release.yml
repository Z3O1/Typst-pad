name: Release

# 发布在打 tag 时自动进行：本 workflow 自己 checkout + 构建安装包 + 发布，
# 不再依赖 ci.yml 上传的 artifact（download-artifact 只能拿当前 run 的产物，
# 且 push tag 不触发 ci.yml，跨 workflow 取产物链路不可靠）。
# 构建可命中 ci.yml 中 main 分支 build-bundles 写入的 Rust/npm 缓存
# （GitHub Actions 缓存按 ref 隔离，但所有 tag 都能读 main 分支的缓存）。
# action 版本与 ci.yml 保持一致（Node 24 版本线，见 ci.yml 顶部注释）：
# checkout v5 / setup-node v5 / cache v5 / softprops/action-gh-release v3
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布用 tag，需已存在（如 v0.2.8）"
        required: true
        default: ""

# GITHUB_TOKEN 默认只读；创建/更新 Release 需要 contents: write
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # tag 触发时检出该 tag；手动触发时检出填写的 tag，保证产物与 tag 严格对应
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 缓存：命中 ci.yml 的 main 分支构建写入的缓存，避免每次发版全量编译。
      # 失败/中断不保存缓存（rust-cache 默认行为）：被 cancel 的 run 保存的半成品
      # 会被后续 run 精确命中且不覆盖，坏缓存永续（踩过坑，勿加 cache-on-failure）
      # shared-key 必须与 ci.yml 的 build-bundles 相同（覆盖默认 job 名 key），
      # 否则 key 含 job 名（release），读不到 build-bundles 写的缓存
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-build-windows

      - name: Install frontend dependencies
        run: npm ci

      # 缓存 Tauri 打包工具（WiX/NSIS 下载解压产物），避免每次全新下载；
      # key 含 package-lock.json 哈希：依赖升级（tauri-cli 打包逻辑变化）时自动失效重建，
      # 锁文件不变则稳定命中（与 ci.yml 的 build-bundles 保持一致的 key 规则）
      - name: Cache Tauri bundler tools
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundle-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build installers (nsis + msi)
        run: npm run tauri build
        env:
          # 自动更新的签名私钥（必填）：bundle.createUpdaterArtifacts 为 true 且
          # tauri.conf.json 里填了 pubkey 之后，**没有私钥打包直接失败**
          # （CLI 原文：A public key has been found, but no private key）。
          # 私钥/密码存在仓库 Secrets 里，仅本 workflow 与 ci.yml 的 build-bundles 使用。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 生成自动更新清单 latest.json（客户端 updater 取的端点见 tauri.conf.json 的
      # plugins.updater.endpoints，默认是 releases/latest/download/latest.json）。
      # 内容 = 版本号 + 安装包下载地址 + 安装包签名（.sig），更新说明默认取 CHANGELOG.md
      # 里该版本的正文。**注意**：本 Release 是草稿，草稿资产不对外 —— 清单要等手动
      # Publish 之后客户端才拉得到（这也是"发版要记得 Publish"的又一个理由）。
      - name: Generate updater manifest (latest.json)
        run: node scripts/generate-latest-json.mjs --tag "${{ github.event.inputs.tag_name || github.ref_name }}" --out latest.json

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          # bundle/** 里除安装包外还带着它们的 .sig 签名（createUpdaterArtifacts 产生）；
          # latest.json 里的 signature 字段就是这些 .sig 的内容
          files: |
            src-tauri/target/release/bundle/**
            latest.json
          draft: true
          generate_release_notes: false

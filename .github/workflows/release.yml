name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# GITHUB_TOKEN 默认只读；创建/更新 Release 需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 增量编译缓存：二次构建可省约 8-10 分钟。
      # 缓存 key 基于 rust 版本 + Cargo.lock 哈希；依赖不变（Cargo.lock 不变）
      # 时跨版本命中，依赖变化则自动失效。请勿在每次发版时改 Cargo.toml
      # 的 version（会导致 Cargo.lock 变化、缓存失效）。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：配置后可生成带签名的安装包（应用内自动更新需要）
          # 生成方式：npm run tauri signer generate
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseDraft: true
          releaseBody: |
            请下载对应安装包进行安装。

            如需自动更新支持，请先在仓库 Secrets 中配置
            `TAURI_SIGNING_PRIVATE_KEY` 与 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`。

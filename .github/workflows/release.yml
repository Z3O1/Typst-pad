name: Release

# 构建与发布分离：安装包由 CI（ci.yml，push main/PR）构建并上传为 artifact；
# 本 workflow 仅在打 tag 时触发，只下载 artifact 并发布为 GitHub Release。
# 不安装任何依赖、不使用 Rust 缓存（发布步骤本身就是轻量的）。
on:
  push:
    tags: ["v*"]

# GITHUB_TOKEN 默认只读；创建/更新 Release 需要 contents: write
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles

      - name: List bundles
        run: ls -la bundles

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/**
          draft: true
          generate_release_notes: false

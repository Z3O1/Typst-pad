[package]
name = "typst-pad"
# 注意：此版本号保持稳定（不与应用发版版本同步）。
# CI 的 Rust 缓存（Swatinem/rust-cache）key 基于 Cargo.lock 哈希，
# 每次改这里都会使 Cargo.lock 变化、缓存失效（全量重编约 14 分钟）。
# 应用/安装包版本以 tauri.conf.json 与 package.json 的 version 为准。
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typst_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# 禁用 WebView2 浏览器加速键（Ctrl+R 整页刷新等）：直接操作 WebView2 COM 接口
webview2-com = "0.38"
# Interface::cast（ICoreWebView2Settings → ICoreWebView2Settings3）所需，与 webview2-com 的 windows-core 同版本
windows-core = "0.61"


[package]
name = "typst-pad"
# 版本号与应用发版同步：与 package.json、tauri.conf.json 的 version 三处一致修改
# （0.4.0 起 Cargo.toml 参与发版，勿单独改动）。
# 注意：改动依赖会改变 Cargo.lock，使 CI 的 Rust 缓存（Swatinem/rust-cache，
# key 基于 Cargo.lock 哈希）失效并全量重编（引入 typst 依赖树时已付出一次）；
# 仅改版本号不动依赖时 Cargo.lock 不变，缓存可跨版本命中。
version = "0.7.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typst_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# 自动更新（检查 / 下载 / 安装）：签名公钥写在 tauri.conf.json 的 plugins.updater.pubkey。
# ⚠️ pubkey 一旦入配置，任何 `tauri build` 都必须能拿到私钥
# （TAURI_SIGNING_PRIVATE_KEY 或 TAURI_SIGNING_PRIVATE_KEY_PATH），否则打包直接失败
# （CLI 原文：A public key has been found, but no private key）。密钥保管见 CLAUDE.md。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 内嵌 Typst 编译引擎（进程内编译，替代前端 WASM 编译）
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
# @preview 在线包：下载（ureq）/解压（tar + flate2）；包目录（dirs，与 typst CLI 同款）。
# flate2/dirs 已在传递依赖树中（typst-pdf/tauri），直接声明不新增编译；ureq/tar 为全新依赖。
ureq = "3"
tar = "0.4"
flate2 = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
# 禁用 WebView2 浏览器加速键（Ctrl+R 整页刷新等）：直接操作 WebView2 COM 接口
webview2-com = "0.38"
# Interface::cast（ICoreWebView2Settings → ICoreWebView2Settings3）所需，与 webview2-com 的 windows-core 同版本
windows-core = "0.61"

